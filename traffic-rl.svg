<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d1b69"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg4)"/>

  <!-- Decorative dots -->
  <g fill="#754ef9" opacity="0.3">
    <circle cx="60" cy="60" r="3"/>
    <circle cx="120" cy="100" r="2"/>
    <circle cx="740" cy="50" r="3"/>
    <circle cx="700" cy="100" r="2"/>
  </g>

  <!-- Roads (cross intersection) -->
  <rect x="0" y="210" width="800" height="120" fill="#2a2a3e"/>
  <rect x="340" y="0" width="120" height="500" fill="#2a2a3e"/>

  <!-- Intersection center -->
  <rect x="340" y="210" width="120" height="120" fill="#33334a"/>

  <!-- Road dividing lines -->
  <line x1="0" y1="270" x2="340" y2="270" stroke="#ffeb3b" stroke-width="3" stroke-dasharray="22 18" opacity="0.85"/>
  <line x1="460" y1="270" x2="800" y2="270" stroke="#ffeb3b" stroke-width="3" stroke-dasharray="22 18" opacity="0.85"/>
  <line x1="400" y1="0" x2="400" y2="210" stroke="#ffeb3b" stroke-width="3" stroke-dasharray="22 18" opacity="0.85"/>
  <line x1="400" y1="330" x2="400" y2="500" stroke="#ffeb3b" stroke-width="3" stroke-dasharray="22 18" opacity="0.85"/>

  <!-- Crosswalks -->
  <g fill="#fff" opacity="0.55">
    <rect x="320" y="215" width="6" height="20"/>
    <rect x="320" y="240" width="6" height="20"/>
    <rect x="320" y="265" width="6" height="20"/>
    <rect x="320" y="290" width="6" height="20"/>

    <rect x="474" y="215" width="6" height="20"/>
    <rect x="474" y="240" width="6" height="20"/>
    <rect x="474" y="265" width="6" height="20"/>
    <rect x="474" y="290" width="6" height="20"/>
  </g>

  <!-- Cars on roads -->
  <!-- Horizontal lane (going right) -->
  <g>
    <rect x="80" y="225" width="44" height="24" rx="5" fill="#ff7eb3"/>
    <rect x="160" y="225" width="44" height="24" rx="5" fill="#27c93f"/>
    <rect x="240" y="225" width="44" height="24" rx="5" fill="#ffbd2e"/>
  </g>
  <!-- Horizontal lane (going left) -->
  <g>
    <rect x="500" y="285" width="44" height="24" rx="5" fill="#754ef9"/>
    <rect x="580" y="285" width="44" height="24" rx="5" fill="#ff5f56"/>
    <rect x="660" y="285" width="44" height="24" rx="5" fill="#ff7eb3"/>
  </g>
  <!-- Vertical lane (going down) -->
  <g>
    <rect x="355" y="50" width="24" height="44" rx="5" fill="#27c93f"/>
    <rect x="355" y="120" width="24" height="44" rx="5" fill="#ffbd2e"/>
  </g>
  <!-- Vertical lane (going up) -->
  <g>
    <rect x="418" y="370" width="24" height="44" rx="5" fill="#ff7eb3"/>
    <rect x="418" y="440" width="24" height="44" rx="5" fill="#754ef9"/>
  </g>

  <!-- Traffic light (right side, big) -->
  <g transform="translate(600, 60)">
    <line x1="40" y1="240" x2="40" y2="300" stroke="#754ef9" stroke-width="5"/>
    <rect x="0" y="0" width="80" height="240" rx="14" fill="#15152a" stroke="#754ef9" stroke-width="3"/>
    <circle cx="40" cy="50" r="22" fill="#ff5f56" opacity="0.25"/>
    <circle cx="40" cy="120" r="22" fill="#ffbd2e" opacity="0.25"/>
    <circle cx="40" cy="190" r="24" fill="#27c93f"/>
    <!-- Glow on active light -->
    <circle cx="40" cy="190" r="32" fill="#27c93f" opacity="0.3"/>
  </g>

  <!-- RL Agent label -->
  <g transform="translate(60, 380)">
    <rect x="0" y="0" width="180" height="48" rx="24" fill="#754ef9"/>
    <circle cx="28" cy="24" r="10" fill="#fff"/>
    <text x="100" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#fff">RL AGENT</text>
  </g>

  <!-- Reward indicator -->
  <g transform="translate(560, 380)">
    <rect x="0" y="0" width="180" height="48" rx="24" fill="#27c93f"/>
    <text x="90" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#fff">−38% WAIT</text>
  </g>
</svg>
