<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#2d1b69"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg1)"/>

  <!-- Decorative dots in background -->
  <g fill="#754ef9" opacity="0.25">
    <circle cx="60" cy="60" r="3"/>
    <circle cx="740" cy="80" r="4"/>
    <circle cx="700" cy="430" r="3"/>
    <circle cx="80" cy="450" r="4"/>
  </g>

  <!-- Terminal window -->
  <rect x="110" y="90" width="580" height="340" rx="14" fill="#0d0d1a" stroke="#754ef9" stroke-width="2"/>

  <!-- Window title bar -->
  <rect x="110" y="90" width="580" height="42" rx="14" fill="#15152a"/>
  <rect x="110" y="118" width="580" height="14" fill="#15152a"/>

  <!-- Window dots -->
  <circle cx="140" cy="111" r="7" fill="#ff5f56"/>
  <circle cx="165" cy="111" r="7" fill="#ffbd2e"/>
  <circle cx="190" cy="111" r="7" fill="#27c93f"/>

  <!-- Title -->
  <text x="400" y="116" text-anchor="middle" font-family="monospace" font-size="14" fill="#7a7a99">~ cli-shop</text>

  <!-- Terminal content -->
  <text x="140" y="180" font-family="monospace" font-size="18" fill="#27c93f">$ ./shop start</text>
  <text x="140" y="215" font-family="monospace" font-size="15" fill="#a8a8b8">Welcome to CLI E-Commerce</text>
  <text x="140" y="250" font-family="monospace" font-size="15" fill="#754ef9">&gt; browse products</text>
  <text x="140" y="280" font-family="monospace" font-size="15" fill="#a8a8b8">  [1] Laptop    $899.00</text>
  <text x="140" y="305" font-family="monospace" font-size="15" fill="#a8a8b8">  [2] Headset   $129.99</text>
  <text x="140" y="335" font-family="monospace" font-size="15" fill="#754ef9">&gt; add-to-cart 1</text>
  <text x="140" y="365" font-family="monospace" font-size="15" fill="#27c93f">✓ Added to cart</text>
  <text x="140" y="400" font-family="monospace" font-size="18" fill="#27c93f">$ <tspan fill="#fff">_</tspan></text>

  <!-- Cart icon top right -->
  <g transform="translate(580, 200)" stroke="#754ef9" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 0 5 L 15 5 L 22 45 L 65 45 L 72 18 L 18 18"/>
    <circle cx="28" cy="60" r="6" fill="#754ef9"/>
    <circle cx="58" cy="60" r="6" fill="#754ef9"/>
  </g>
</svg>
