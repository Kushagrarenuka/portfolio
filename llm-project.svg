<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#754ef9"/>
      <stop offset="100%" style="stop-color:#2d1b69"/>
    </linearGradient>
    <radialGradient id="aiGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#fff;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg3)"/>

  <!-- Floating token dots -->
  <g fill="#fff" opacity="0.5">
    <circle cx="80" cy="70" r="4"/>
    <circle cx="160" cy="50" r="3"/>
    <circle cx="240" cy="90" r="5"/>
    <circle cx="320" cy="60" r="3"/>
    <circle cx="560" cy="80" r="4"/>
    <circle cx="640" cy="60" r="3"/>
    <circle cx="720" cy="100" r="5"/>
    <circle cx="100" cy="430" r="4"/>
    <circle cx="200" cy="450" r="3"/>
    <circle cx="600" cy="430" r="5"/>
    <circle cx="700" cy="450" r="4"/>
    <circle cx="750" cy="400" r="3"/>
  </g>

  <!-- User chat bubble (left) -->
  <g>
    <rect x="80" y="130" width="260" height="90" rx="22" fill="#fff" opacity="0.95"/>
    <path d="M 110 220 L 90 250 L 135 220 Z" fill="#fff" opacity="0.95"/>
    <text x="110" y="165" font-family="sans-serif" font-size="13" font-weight="700" fill="#754ef9">USER</text>
    <line x1="110" y1="185" x2="310" y2="185" stroke="#754ef9" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <line x1="110" y1="200" x2="270" y2="200" stroke="#754ef9" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- AI response bubble (right) -->
  <g>
    <rect x="460" y="290" width="260" height="90" rx="22" fill="#ff7eb3" opacity="0.95"/>
    <path d="M 690 380 L 710 410 L 665 380 Z" fill="#ff7eb3" opacity="0.95"/>
    <text x="485" y="325" font-family="sans-serif" font-size="13" font-weight="700" fill="#fff">LLM</text>
    <line x1="485" y1="345" x2="690" y2="345" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.95"/>
    <line x1="485" y1="360" x2="650" y2="360" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Central LLM brain core -->
  <g transform="translate(400, 250)">
    <circle cx="0" cy="0" r="85" fill="url(#aiGlow)"/>
    <circle cx="0" cy="0" r="60" fill="#fff" opacity="0.12"/>
    <circle cx="0" cy="0" r="45" fill="#fff"/>
    <text x="0" y="8" text-anchor="middle" font-family="monospace" font-size="22" font-weight="800" fill="#754ef9">LLM</text>
  </g>

  <!-- Connecting flow lines -->
  <g stroke="#fff" stroke-width="2" fill="none" opacity="0.5" stroke-dasharray="6 6">
    <path d="M 280 220 Q 340 240 360 240"/>
    <path d="M 440 260 Q 460 280 470 300"/>
  </g>

  <!-- RAG label -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="180" height="34" rx="17" fill="#fff" opacity="0.95"/>
    <text x="90" y="22" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#754ef9">RAG + LANGCHAIN</text>
  </g>
</svg>
