<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5e3dd4"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#fff;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg2)"/>
  <ellipse cx="400" cy="250" rx="300" ry="200" fill="url(#glow2)"/>

  <!-- Neural network connection lines -->
  <g stroke="#fff" stroke-width="1.2" opacity="0.3" fill="none">
    <line x1="130" y1="120" x2="320" y2="200"/>
    <line x1="130" y1="120" x2="320" y2="300"/>
    <line x1="160" y1="250" x2="320" y2="200"/>
    <line x1="160" y1="250" x2="320" y2="300"/>
    <line x1="130" y1="380" x2="320" y2="200"/>
    <line x1="130" y1="380" x2="320" y2="300"/>
    <line x1="480" y1="200" x2="670" y2="130"/>
    <line x1="480" y1="200" x2="640" y2="250"/>
    <line x1="480" y1="300" x2="640" y2="250"/>
    <line x1="480" y1="300" x2="670" y2="370"/>
  </g>

  <!-- Input layer nodes (left) -->
  <g>
    <circle cx="130" cy="120" r="14" fill="#ff7eb3"/>
    <circle cx="160" cy="250" r="14" fill="#ff7eb3"/>
    <circle cx="130" cy="380" r="14" fill="#ff7eb3"/>
  </g>

  <!-- Output layer nodes (right) -->
  <g>
    <circle cx="670" cy="130" r="14" fill="#27c93f"/>
    <circle cx="640" cy="250" r="14" fill="#27c93f"/>
    <circle cx="670" cy="370" r="14" fill="#27c93f"/>
  </g>

  <!-- Central medical cross with stethoscope feel -->
  <g transform="translate(400, 250)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="95" fill="#fff" opacity="0.08"/>
    <circle cx="0" cy="0" r="75" fill="#fff" opacity="0.95"/>
    <!-- Cross -->
    <rect x="-12" y="-50" width="24" height="100" rx="4" fill="#ff5f56"/>
    <rect x="-50" y="-12" width="100" height="24" rx="4" fill="#ff5f56"/>
  </g>

  <!-- Mid-layer hidden nodes -->
  <g fill="#754ef9">
    <circle cx="320" cy="200" r="10"/>
    <circle cx="320" cy="300" r="10"/>
    <circle cx="480" cy="200" r="10"/>
    <circle cx="480" cy="300" r="10"/>
  </g>

  <!-- Heartbeat line at bottom -->
  <path d="M 50 460 L 180 460 L 200 430 L 225 480 L 250 410 L 275 470 L 300 460 L 750 460"
        stroke="#27c93f" stroke-width="3" fill="none" opacity="0.7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Label tag -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="170" height="34" rx="17" fill="#754ef9"/>
    <text x="85" y="22" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#fff">ML CLASSIFIER</text>
  </g>
</svg>
